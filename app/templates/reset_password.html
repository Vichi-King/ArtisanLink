{% extends "base.html" %}
{% block title %}Reset Password | ArtisanLink{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-form-panel"><div class="auth-form-wrapper"><div class="auth-heading"><span>SECURE RECOVERY</span><h2>Choose a new password</h2><p>Your new password must contain at least 8 characters.</p></div><form method="POST" class="auth-form"><div class="auth-field"><label for="password">New Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required></div><div class="auth-field"><label for="confirm_password">Confirm Password</label><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required></div><button type="submit" class="auth-submit">Reset password <span>→</span></button></form></div></div></section>
{% endblock %}
