<div class="modal fade" id="passwordUpdateModal" tabindex="-1" aria-labelledby="passwordUpdateModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content al-modal-content">
            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="passwordUpdateModalLabel">Update password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" required>
                        <div class="form-text">At least 8 characters.</div>
                    </div>
                    <div class="mb-1">
                        <label for="confirm_new_password" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" minlength="8" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn al-modal-submit">Update password</button>
                </div>
            </form>
        </div>
    </div>
</div>
