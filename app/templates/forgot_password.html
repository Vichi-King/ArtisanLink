{% extends "base.html" %}
{% block title %}Forgot Password | ArtisanLink{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-form-panel"><div class="auth-form-wrapper"><div class="auth-heading"><span>PASSWORD RECOVERY</span><h2>Reset your password</h2><p>Enter your account email and we'll send a secure reset link if the account exists.</p></div><form method="POST" class="auth-form"><div class="auth-field"><label for="email">Email Address</label><input type="email" id="email" name="email" autocomplete="email" required></div><button type="submit" class="auth-submit">Send reset link <span>→</span></button></form><div class="auth-switch"><a href="{{ url_for('login') }}">← Back to login</a></div></div></div></section>
{% endblock %}
