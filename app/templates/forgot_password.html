{% extends "base.html" %}
{% block title %}Forgot Password | ArtisanLink{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recovery.css') }}">
<section class="password-recovery-page">
    <div class="password-recovery-form">
        <h2>Reset your password</h2>
        <p>Enter your account email and we'll send a secure reset link if the account exists.</p>
        <form method="POST" class="auth-form">
            <div class="auth-field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>
            <button type="submit" class="auth-submit">Send reset link <span>→</span></button>
        </form>
        <a class="password-recovery-back" href="{{ url_for('login') }}">← Back to login</a>
    </div>
</section>
{% endblock %}
